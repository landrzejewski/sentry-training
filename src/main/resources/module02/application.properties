# checkout-api w Spring Boot: konfiguracja wspólna dla scenariuszy 7 i 8 modułu 2.
server.port=0
spring.main.banner-mode=off
logging.level.root=WARN
# Tylko w demo: Tomcat loguje pełny stack trace każdego błędu 500, co zasłaniałoby wydruk eventów.
# W prawdziwej aplikacji ten log zostaje.
logging.level.org.apache.catalina.core.ContainerBase=OFF
# Integracja Logback (moduł 5) jest w projekcie, a starter rejestruje jej appender sam. Ten moduł
# jej nie omawia, więc jest wyłączona: log ERROR nie tworzy eventu, a przy sentry.enabled=false
# appender nie inicjalizuje SDK ponownie z SENTRY_DSN odziedziczonego z shella.
sentry.logging.enabled=false

# sentry.dsn celowo nie ma w pliku. W produkcji przychodzi ze zmiennej SENTRY_DSN, którą Spring Boot
# mapuje na właściwość sentry.dsn. Brak tej właściwości oznacza, że auto-konfiguracja Sentry w ogóle
# się nie uruchamia.

# Wartości domyślne ustawione jawnie, żeby ich zmiana była widoczna w review.
sentry.send-default-pii=false
sentry.max-request-body-size=none

# Starter sam oznacza jako in-app tylko pakiet klasy z @SpringBootConfiguration (tu ...module02.spring).
# Kod domenowy z pakietu nadrzędnego (CheckoutService, PaymentGateway) byłby w stack trace zwinięty
# jak kod biblioteki, więc pakiet aplikacji podajemy jawnie.
sentry.in-app-includes=pl.training.sentry.module02

# Release ma przyjść jawnie z pipeline (zmienna SENTRY_RELEASE). Przy wartości true, bez release
# i z plikiem git.properties na classpath starter użyłby samego commit id, czyli innej nazwy niż
# release utworzony w CI/CD. Wyłączone, żeby brak release był widoczny, a nie zastąpiony po cichu.
sentry.use-git-commit-id-as-release=false

# environment i release w szkoleniu ustawia bean SentryTrainingConfiguration, który starter wywołuje
# po powiązaniu właściwości, więc sentry.environment i sentry.release z pliku zostałyby nadpisane.
