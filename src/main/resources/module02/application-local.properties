# Profil laptopa developera.
# Brak sentry.dsn: auto-konfiguracja Sentry się nie uruchamia.
# sentry.enabled=false to druga linia obrony. Gdy DSN przyjdzie ze zmiennej SENTRY_DSN (odziedziczonej
# z shella albo wczytanej z pliku .env przez IDE lub skrypt startowy), starter wystartuje, ale SDK nic
# nie wyśle (scenariusz 7B).
sentry.enabled=false
