# PUŁAPKA: profil włączony „na chwilę”, żeby przy debugowaniu błędu 500 zobaczyć body requestu.
# Event zawiera wtedy body (JSON z numerem karty), wszystkie nagłówki (Authorization, X-Forwarded-For),
# cookies (SDK zamienia na [Filtered] tylko znane ciasteczka sesji, np. JSESSIONID) i user.ip wzięty
# z X-Forwarded-For, który klient może ustawić sam.
# Body wymaga obu właściwości naraz: max-request-body-size bez send-default-pii nic nie zmienia.
sentry.send-default-pii=true
sentry.max-request-body-size=always
