spring.application.name=shop-api
# 8090 zamiast domyślnego 8080, który na laptopach często zajmuje inna aplikacja.
server.port=8090

# Krok 2: konfiguracja Sentry.
# DSN tylko ze zmiennej środowiskowej: adres projektu nie trafia do repozytorium, a bez zmiennej
# SDK jest wyłączone (bez błędu i bez ostrzeżenia, dlatego ShopApplication loguje stan przy starcie).
sentry.dsn=${SENTRY_DSN:}
# Bez tej linii SDK wysyła environment=production, także z laptopa i ze stagingu.
sentry.environment=${SENTRY_ENVIRONMENT:local}
# Release z pom.xml (shop-api@1.0.0). Pipeline CI nadpisuje go zmienną SENTRY_RELEASE.
sentry.release=@sentry.release@
# Transakcja dla każdego requestu. 1.0 tylko na szkoleniu, w produkcji stawka zależy od ruchu.
sentry.traces-sample-rate=1.0
